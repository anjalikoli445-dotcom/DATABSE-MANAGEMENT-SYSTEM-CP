<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="byGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle tricolor feel -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#byGrad)"/>

  <!-- Ashoka Chakra circle -->
  <circle cx="32" cy="32" r="16" fill="url(#wheelGrad)"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Wheel spokes (24-spoke feel, we draw 8 visible) -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.95">
    <line x1="32" y1="16" x2="32" y2="48"/>
    <line x1="16" y1="32" x2="48" y2="32"/>
    <line x1="20" y1="20" x2="44" y2="44"/>
    <line x1="44" y1="20" x2="20" y2="44"/>
    <line x1="24" y1="17" x2="40" y2="47"/>
    <line x1="40" y1="17" x2="24" y2="47"/>
    <line x1="17" y1="24" x2="47" y2="40"/>
    <line x1="17" y1="40" x2="47" y2="24"/>
  </g>

  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>

  <!-- Small airplane top-right corner -->
  <path d="M 50 8 L 56 6 L 54 12 L 60 12 L 56 16 L 58 20 L 52 16 L 48 18 L 50 14 Z"
        fill="#ffffff" opacity="0.95"/>
</svg>